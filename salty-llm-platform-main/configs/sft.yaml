# SFT 阶段(对应旧 train_sft.py)
stage: sft
tokenizer_path: ./minimind_tokenizer
data_path: ./data/raw/sft_t2t_mini_cleaned.jsonl
pt_ckpt: ./checkpoints/pretrain/step_134500.pt
ckpt_dir: ./checkpoints/sft
log_dir: ./runs/sft

max_seq_len: 2048
seed: 42
device: cuda

max_iters: 85000
warmup: 2000
lr: 5.0e-5
min_lr: 1.0e-6
weight_decay: 0.05
batch_size: 2
grad_accum: 16
grad_clip: 1.0

save_interval: 500
eval_interval: 500
log_every: 10
use_amp: true
amp_dtype: bfloat16

model:
  dim: 512
  n_layers: 6
  n_heads: 8
  n_kv_heads: 2
  ffn_hidden_dim: 1536
  max_seq_len: 2048
  dropout: 0.0
