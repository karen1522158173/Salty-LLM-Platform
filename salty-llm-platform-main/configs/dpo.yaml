# DPO 阶段(对应旧 train_DPO.py)
stage: dpo
tokenizer_path: ./minimind_tokenizer
data_path: ./data/raw/dpo.jsonl
ref_ckpt: ./checkpoints/sft/sft_step_28500.pt
ckpt_dir: ./checkpoints/dpo
log_dir: ./runs/dpo

max_seq_len: 2048
seed: 42
device: cuda

max_iters: 4000          # 旧脚本只跑了 1 个 epoch,这里给一个上限
warmup: 100
lr: 2.0e-7
min_lr: 1.0e-8
weight_decay: 0.0
batch_size: 8
grad_accum: 4
grad_clip: 1.0

beta: 0.1
smoothing: 0.95
num_workers: 4

save_interval: 2000
log_every: 10
use_amp: true
amp_dtype: bfloat16

model:
  dim: 512
  n_layers: 6
  n_heads: 8
  n_kv_heads: 2
  ffn_hidden_dim: 1536
  max_seq_len: 2048
  dropout: 0.0
